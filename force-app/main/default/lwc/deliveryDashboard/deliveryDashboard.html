

<template>
    

<lightning-card title="Delivery Dashboard">
    <template if:true={dashboardData}>

        <div class="slds-grid slds-gutters slds-p-around_medium">

            <div class="slds-col">
                <div class="kpi-box"> 
                    <lightning-card>

                        <div class="kpi-title">

                            📦 Total Orders

                        </div>

                        <div class="kpi-value">

                            ${dashboardData.totalOrders}

                        </div>

                    </lightning-card>
                </div>

            </div>

            <div class="slds-col">
                <div class="kpi-box"> 
                    <lightning-card>

                        <div class="kpi-title">

                            💰 Revenue

                        </div>

                        <div class="kpi-value">

                            ${dashboardData.totalRevenue}

                        </div>

                    </lightning-card>
                </div>

            </div>
            

            <div class="slds-col">
                <div class="kpi-box">
                    <lightning-card>

                        <div class="kpi-title">

                            ⏳ Pending

                        </div>

                        <div class="kpi-value">

                            ${dashboardData.pendingOrders}

                        </div>

                    </lightning-card>
                </div>

            </div>

            <div class="slds-col">
                <div class="kpi-box"> 
                    <lightning-card>

                        <div class="kpi-title">

                            ✅ Delivered

                        </div>

                        <div class="kpi-value">

                            ${dashboardData.deliveredOrders}

                        </div>

                    </lightning-card>
                </div>

            </div>
            <div class="slds-col">
                <div class="kpi-box"> 
                    <lightning-card>

                        <div class="kpi-title">

                            💵 Average Order

                        </div>

                        <div class="kpi-value">

                           R$ {dashboardData.averageOrderValue}

                        </div>

                    </lightning-card>
                </div>

            </div>
            

        </div>

    </template>

    <div class="slds-p-around_medium">

        <lightning-combobox

            label="Client"

            value={clientId}

            options={clientOptions}

            onchange={handleClientChange}>

        </lightning-combobox>

        <lightning-button
            label="Create Order"
            variant="brand"
            onclick={createNewOrder}
            class="slds-m-top_medium">
        </lightning-button>

    </div>

    <template if:true={orders}>

        <div class="slds-p-around_medium">

            <template
                for:each={orders}
                for:item="order">

                <div
                    key={order.Id}
                    class="slds-box slds-m-bottom_small">

                    <p>

                        <strong>
                            Order:
                        </strong>

                        {order.Name}

                    </p>

                    <p>

                        <strong>
                            Client:
                        </strong>

                        {order.Delivery_Client__r.Name}

                    </p>

                    <p>

                        <strong>
                            Status:
                        </strong>

                        <span class={order.statusClass}>

                            {order.Status__c}

                        </span>

                    </p>

                    <p class="order-total">

                        Total:
                        R$ {order.Total_Amount__c}

                    </p>

                    <lightning-button
                        label="Delete"
                        variant="destructive"
                        data-id={order.Id}
                        onclick={deleteSelectedOrder}
                        class="slds-m-top_small">
                    </lightning-button>

                    <lightning-button
                        label="Prepare"
                        variant="brand"
                        data-id={order.Id}
                        data-status="Preparing"
                        onclick={changeStatus}
                        class="slds-m-left_small">
                    </lightning-button>

                    <lightning-button
                        label="Send Delivery"
                        variant="success"
                        data-id={order.Id}
                        data-status="Out For Delivery"
                        onclick={changeStatus}
                        class="slds-m-left_small">
                    </lightning-button>

                    <lightning-button
                        label="Delivered"
                        variant="success"
                        data-id={order.Id}
                        data-status="Delivered"
                        onclick={changeStatus}
                        class="slds-m-left_small">
                    </lightning-button>

                    <lightning-button
                        label="View Items"
                        variant="brand"
                        data-id={order.Id}
                        data-name={order.Name}
                        onclick={selectOrder}
                        class="slds-m-top_small slds-m-left_small">
                    </lightning-button>

                    <template if:true={order.isExpanded}>

                        <div
                            class="slds-box
                                slds-theme_shade
                                slds-m-top_medium">

                            <h3
                                class="slds-text-heading_medium
                                    slds-m-bottom_small">

                                Editing Order:
                                {order.Name}

                            </h3>

                            <template
                                for:each={orderItems}
                                for:item="item">

                                <div
                                    key={item.Id}
                                    class="slds-box
                                        slds-m-bottom_small">

                                    <p>

                                        <strong>
                                            Product:
                                        </strong>

                                        {item.Menu_Item__r.Name}

                                    </p>

                                    <p>

                                        <strong>
                                            Quantity:
                                        </strong>

                                        {item.Quantity__c}

                                    </p>

                                    <p>

                                        <strong>
                                            Subtotal:
                                        </strong>

                                        {item.Subtotal__c}

                                    </p>
                                    <lightning-button
                                        label="Delete"
                                        variant="destructive"
                                        data-id={item.Id}
                                        onclick={deleteItem}
                                        class="slds-m-top_small">
                                    </lightning-button>

                                </div>

                            </template>
                            
                            <div class="slds-m-top_medium">

                                <lightning-combobox
                                    label="Menu Item"
                                    value={menuItemId}
                                    options={menuItemOptions}
                                    onchange={handleMenuItemChange}>
                                </lightning-combobox>

                                <lightning-input
                                    type="number"
                                    label="Quantity"
                                    value={quantity}
                                    onchange={handleQuantityChange}>
                                </lightning-input>

                                <lightning-button
                                    label="Add Item"
                                    variant="brand"
                                    onclick={addItemToOrder}
                                    class="slds-m-top_small">
                                </lightning-button>

                                <lightning-button
                                label="Close"
                                variant="neutral"
                                data-id={order.Id}
                                data-name={order.Name}
                                onclick={selectOrder}>
                                </lightning-button>


                            </div>

                            
                        </div>

                    </template>
                    <template if:true={selectedOrderId}>

                        <template lwc:if={order.Id}>

                        </template>

                    </template>
                </div>

            </template>

        </div>

    </template>  

</lightning-card>

</template>
