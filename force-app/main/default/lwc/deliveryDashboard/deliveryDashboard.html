<template>


<lightning-card title="Delivery Dashboard">

    <div class="slds-p-around_medium">

        <lightning-input
            label="Client Id"
            value={clientId}
            onchange={handleClientChange}>
        </lightning-input>

        <lightning-button
            label="Create Order"
            variant="brand"
            onclick={createNewOrder}
            class="slds-m-top_medium">
        </lightning-button>

    </div>

    <template if:true={orders}>

        <div class="slds-p-around_medium">

            <template
                for:each={orders}
                for:item="order">

                <div
                    key={order.Id}
                    class="slds-box slds-m-bottom_small">

                    <p>

                        <strong>
                            Order:
                        </strong>

                        {order.Name}

                    </p>

                    <p>

                        <strong>
                            Client:
                        </strong>

                        {order.Delivery_Client__r.Name}

                    </p>

                    <p>

                        <strong>
                            Status:
                        </strong>

                        {order.Status__c}

                    </p>

                    <lightning-button
                        label="Delete"
                        variant="destructive"
                        data-id={order.Id}
                        onclick={deleteSelectedOrder}
                        class="slds-m-top_small">
                    </lightning-button>

                </div>

            </template>

        </div>

    </template>

</lightning-card>


</template>
