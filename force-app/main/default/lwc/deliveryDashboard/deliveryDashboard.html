

<template>

<lightning-card title="Delivery Dashboard">

    <div class="slds-p-around_medium">

        <lightning-combobox

            label="Client"

            value={clientId}

            options={clientOptions}

            onchange={handleClientChange}>

        </lightning-combobox>

        <lightning-button
            label="Create Order"
            variant="brand"
            onclick={createNewOrder}
            class="slds-m-top_medium">
        </lightning-button>

    </div>

    <template if:true={orders}>

        <div class="slds-p-around_medium">

            <template
                for:each={orders}
                for:item="order">

                <div
                    key={order.Id}
                    class="slds-box slds-m-bottom_small">

                    <p>

                        <strong>
                            Order:
                        </strong>

                        {order.Name}

                    </p>

                    <p>

                        <strong>
                            Client:
                        </strong>

                        {order.Delivery_Client__r.Name}

                    </p>

                    <p>

                        <strong>
                            Status:
                        </strong>

                        {order.Status__c}

                    </p>

                    <lightning-button
                        label="Delete"
                        variant="destructive"
                        data-id={order.Id}
                        onclick={deleteSelectedOrder}
                        class="slds-m-top_small">
                    </lightning-button>

                    <lightning-button
                        label="Prepare"
                        variant="brand"
                        data-id={order.Id}
                        data-status="Preparing"
                        onclick={changeStatus}
                        class="slds-m-left_small">
                    </lightning-button>

                    <lightning-button
                        label="Send Delivery"
                        variant="success"
                        data-id={order.Id}
                        data-status="Out For Delivery"
                        onclick={changeStatus}
                        class="slds-m-left_small">
                    </lightning-button>

                    <lightning-button
                        label="Delivered"
                        variant="success"
                        data-id={order.Id}
                        data-status="Delivered"
                        onclick={changeStatus}
                        class="slds-m-left_small">
                    </lightning-button>

                    <lightning-button
                        label="View Items"
                        variant="brand"
                        data-id={order.Id}
                        onclick={selectOrder}
                        class="slds-m-top_small slds-m-left_small">
                    </lightning-button>

                </div>

            </template>

        </div>

    </template>

    <template if:true={selectedOrderId}>

        <div class="slds-p-around_medium">

            <lightning-combobox
                label="Menu Item"
                value={menuItemId}
                options={menuItemOptions}
                onchange={handleMenuItemChange}>
            </lightning-combobox>

            <lightning-input
                type="number"
                label="Quantity"
                value={quantity}
                onchange={handleQuantityChange}
                class="slds-m-top_small">
            </lightning-input>

            <lightning-button
                label="Add Item"
                variant="brand"
                onclick={addItemToOrder}
                class="slds-m-top_medium">
            </lightning-button>

        </div>

        <div class="slds-p-around_medium">

            <h2 class="slds-text-heading_medium">
                Order Items
            </h2>

            <template
                for:each={orderItems}
                for:item="item">

                <div
                    key={item.Id}
                    class="slds-box slds-m-bottom_small">

                    <p>

                        <strong>
                            Product:
                        </strong>

                        {item.Menu_Item__r.Name}

                    </p>

                    <p>

                        <strong>
                            Quantity:
                        </strong>

                        {item.Quantity__c}

                    </p>

                    <p>

                        <strong>
                            Subtotal:
                        </strong>

                        {item.Subtotal__c}

                    </p>

                </div>

            </template>

        </div>

    </template>

</lightning-card>


</template>
